<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejercicio 15 - Diseño responsivo con media queries</title>

<body>
  <div class="layout">
    <header class="encabezado"><h1>Mi sitio</h1></header>

        <li><a href="#">Inicio</a></li>
