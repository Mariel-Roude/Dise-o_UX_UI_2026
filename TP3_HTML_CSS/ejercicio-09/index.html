<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 9 - Flexbox: galería de tarjetas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Productos</h1>
    <div class="galeria">
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 1">
        <h2>Producto 1</h2>
        <p class="precio">$ 1500.00</p>
        <button type="button">Agregar</button>
      </article>
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 2">
        <h2>Producto 2</h2>
        <p class="precio">$ 3000.00</p>
        <button type="button">Agregar</button>
      </article>
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 3">
        <h2>Producto 3</h2>
        <p class="precio">$ 4500.00</p>
        <button type="button">Agregar</button>
      </article>
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 4">
        <h2>Producto 4</h2>
        <p class="precio">$ 6000.00</p>
        <button type="button">Agregar</button>
      </article>
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 5">
        <h2>Producto 5</h2>
        <p class="precio">$ 7500.00</p>
        <button type="button">Agregar</button>
      </article>
      <article class="producto">
        <img src="placeholder.svg" alt="Imagen del producto 6">
        <h2>Producto 6</h2>
        <p class="precio">$ 9000.00</p>
        <button type="button">Agregar</button>
      </article>
    </div>
  </main>
</body>
</html>
