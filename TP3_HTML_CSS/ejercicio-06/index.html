<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 - Selectores CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="principal">
    <h1>Selectores CSS</h1>
    <div class="card">
      <p>Texto de la <span class="resaltado">primera</span> tarjeta.</p>
    </div>
    <div class="card" id="destacada">
      <p>Esta tarjeta es <span class="resaltado">destacada</span> (selector de ID).</p>
    </div>
    <div class="aviso">
      <p>Un aviso fuera de las tarjetas, con su <span class="resaltado">propio</span> estilo.</p>
    </div>
  </main>
</body>
</html>
